apiVersion: v1
kind: Secret
metadata:
  name: hse-secrets
  namespace: hse-video
type: Opaque
stringData:
  # Replace all values before applying. URL-encode the password in DATABASE_URL.
  POSTGRES_PASSWORD: replace-me
  DATABASE_URL: postgresql+psycopg://hse:replace-me@postgres:5432/hse
  SERVICE_TOKEN: replace-with-random-service-token
  OPERATOR_TOKEN: replace-with-random-operator-token
  S3_ACCESS_KEY: hse-media
  S3_SECRET_KEY: replace-with-random-media-password
