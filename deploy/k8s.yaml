apiVersion: v1
kind: Namespace
metadata:
  name: hse-video
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  namespace: hse-video
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis
  namespace: hse-video
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evidence
  namespace: hse-video
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio
  namespace: hse-video
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: hse-video
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hse-nginx
  namespace: hse-video
data:
  default.conf: "map $http_upgrade $connection_upgrade {\n    default upgrade;\n \
    \   '' close;\n}\nserver {\n    listen 80;\n    server_name _;\n    root /usr/share/nginx/html;\n\
    \    index index.html;\n    client_max_body_size 34m;\n    add_header X-Content-Type-Options\
    \ nosniff always;\n    add_header Referrer-Policy same-origin always;\n    location\
    \ /api/ {\n        proxy_pass http://backend:8000;\n        proxy_http_version\
    \ 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header\
    \ Connection $connection_upgrade;\n        proxy_set_header Host $host;\n    \
    \    proxy_read_timeout 60s;\n        proxy_buffering off;\n    }\n    location\
    \ / { try_files $uri $uri/ /index.html; }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hse-video
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: hse/frontend:0.1.0
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: nginx
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        readinessProbe:
          httpGet: &id001
            path: /
            port: 80
          periodSeconds: 10
        livenessProbe:
          httpGet: *id001
          periodSeconds: 10
          initialDelaySeconds: 30
        ports:
        - containerPort: 80
      volumes:
      - name: nginx
        configMap:
          name: hse-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hse-video
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hse-video
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: hse/backend:0.1.0
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 2Gi
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: hse-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          value: redis://redis:6379/0
        - name: DEMO_MODE
          value: 'true'
        - name: SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: hse-secrets
              key: SERVICE_TOKEN
        - name: OPERATOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: hse-secrets
              key: OPERATOR_TOKEN
        - name: INFERENCE_URL
          value: http://inference:8001
        - name: MEDIA_DIR
          value: /data/snapshots
        - name: S3_ENDPOINT
          value: http://minio:9000
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: hse-secrets
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: hse-secrets
              key: S3_SECRET_KEY
        - name: S3_BUCKET
          value: hse-evidence
        volumeMounts:
        - name: evidence
          mountPath: /data/snapshots
          readOnly: false
        readinessProbe:
          httpGet: &id001
            path: /api/health
            port: 8000
          periodSeconds: 10
        livenessProbe:
          httpGet: *id001
          periodSeconds: 10
          initialDelaySeconds: 30
        ports:
        - containerPort: 8000
      volumes:
      - name: evidence
        persistentVolumeClaim:
          claimName: evidence
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: hse-video
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: hse-video
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      containers:
      - name: inference
        image: hse/inference:0.1.0
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 8Gi
        env:
        - name: SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: hse-secrets
              key: SERVICE_TOKEN
        - name: ONNX_PROVIDER
          value: CPUExecutionProvider
        - name: DETECTOR_MODEL
          value: /models/person.onnx
        - name: PPE_MODEL
          value: /models/ppe.onnx
        - name: POSE_MODEL
          value: /models/pose.onnx
        - name: BEHAVIOR_MODEL
          value: /models/behavior.onnx
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        readinessProbe:
          httpGet: &id001
            path: /health
            port: 8001
          periodSeconds: 10
        livenessProbe:
          httpGet: *id001
          periodSeconds: 10
          initialDelaySeconds: 30
        ports:
        - containerPort: 8001
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: models
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: hse-video
spec:
  selector:
    app: inference
  ports:
  - port: 8001
    targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: hse-video
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
      - name: ingestion
        image: hse/ingestion:0.1.0
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 2Gi
        env:
        - name: SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: hse-secrets
              key: SERVICE_TOKEN
        - name: BACKEND_URL
          value: http://backend:8000
        - name: INFERENCE_URL
          value: http://inference:8001
        - name: INFERENCE_FPS
          value: '8'
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: hse-video
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 2Gi
        env:
        - name: POSTGRES_DB
          value: hse
        - name: POSTGRES_USER
          value: hse
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hse-secrets
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres
          mountPath: /var/lib/postgresql/data
          readOnly: false
        ports:
        - containerPort: 5432
      volumes:
      - name: postgres
        persistentVolumeClaim:
          claimName: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: hse-video
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: hse-video
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 2Gi
        command:
        - redis-server
        - --appendonly
        - 'yes'
        volumeMounts:
        - name: redis
          mountPath: /data
          readOnly: false
        ports:
        - containerPort: 6379
      volumes:
      - name: redis
        persistentVolumeClaim:
          claimName: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: hse-video
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: hse-video
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 2Gi
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: hse-secrets
              key: S3_ACCESS_KEY
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hse-secrets
              key: S3_SECRET_KEY
        args:
        - server
        - /data
        volumeMounts:
        - name: minio
          mountPath: /data
          readOnly: false
        ports:
        - containerPort: 9000
      volumes:
      - name: minio
        persistentVolumeClaim:
          claimName: minio
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: hse-video
spec:
  selector:
    app: minio
  ports:
  - port: 9000
    targetPort: 9000
