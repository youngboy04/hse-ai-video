name: hse-ai-video
services:
  frontend:
    build: .
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://hse:${POSTGRES_PASSWORD:-hse_local}@postgres:5432/hse}
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: ${DEMO_MODE:-true}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-local-development-change-me}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      INFERENCE_URL: http://inference:8001
      DEBOUNCE_SECONDS: ${DEBOUNCE_SECONDS:-2}
      CLOSE_AFTER_SECONDS: ${CLOSE_AFTER_SECONDS:-3}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-hse_media}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-hse_media_local_change_me}
      S3_BUCKET: hse-evidence
    volumes: ["evidence:/data/snapshots"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  inference:
    build: {context: ., dockerfile: inference/Dockerfile}
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:-local-development-change-me}
      ONNX_PROVIDER: ${ONNX_PROVIDER:-CPUExecutionProvider}
      DETECTOR_MODEL: /models/person.onnx
      PPE_MODEL: /models/ppe.onnx
      POSE_MODEL: /models/pose.onnx
      BEHAVIOR_MODEL: /models/behavior.onnx
      INFERENCE_FPS: 8
    volumes: ["./models:/models:ro"]
    restart: unless-stopped
  ingestion:
    build: {context: ., dockerfile: ingestion/Dockerfile}
    environment:
      BACKEND_URL: http://backend:8000
      INFERENCE_URL: http://inference:8001
      SERVICE_TOKEN: ${SERVICE_TOKEN:-local-development-change-me}
      INFERENCE_FPS: 8
    depends_on:
      backend: {condition: service_healthy}
      inference: {condition: service_started}
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hse
      POSTGRES_USER: hse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hse_local}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hse -d hse"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-hse_media}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-hse_media_local_change_me}
    volumes: ["minio:/data"]
    restart: unless-stopped
volumes:
  postgres:
  redis:
  evidence:
  minio:
